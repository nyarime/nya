# Build + publish GitHub Release assets (Go CLI only).
# Trigger: push tag v*  or  Actions → Release → Run workflow
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version without v (e.g. 0.1.0). Creates/updates release tag vVERSION."
        required: true
        default: "0.1.0"

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - id: v
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
            VER="${TAG#v}"
          else
            VER="${{ inputs.version }}"
            TAG="v${VER}"
          fi
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"

      - name: Build Go CLI
        shell: bash
        run: |
          mkdir -p staging dist
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 \
            go build -trimpath -ldflags="-s -w" -o staging/nya.exe ./cmd/nya
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 \
            go build -trimpath -ldflags="-s -w" -o staging/nya-get.exe ./cmd/nya-get

      - name: UPX static Go CLI
        shell: bash
        run: |
          choco install upx -y --no-progress
          upx --best --lzma staging/nya.exe staging/nya-get.exe

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup -y --no-progress

      - name: Compile installer
        shell: cmd
        run: |
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion=%VERSION% /DStagingDir=%CD%\staging packaging\windows\nya.iss
        env:
          VERSION: ${{ needs.version.outputs.version }}

      - name: Zip portable + collect assets
        shell: bash
        run: |
          VER="${{ needs.version.outputs.version }}"
          mkdir -p dist
          test -f "dist/nya-${VER}-windows-amd64-setup.exe"
          powershell -Command "Compress-Archive -Path staging/nya.exe,staging/nya-get.exe -DestinationPath dist/nya-${VER}-windows-amd64.zip -Force"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/nya-*-windows-amd64-setup.exe
            dist/nya-*-windows-amd64.zip

  linux-amd64:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - name: Install UPX
        run: |
          sudo apt-get update
          sudo apt-get install -y upx-ucl
      - name: Build
        run: |
          VER="${{ needs.version.outputs.version }}"
          mkdir -p staging dist
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o staging/nya ./cmd/nya
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o staging/nya-get ./cmd/nya-get
          chmod +x staging/*
          upx --best --lzma staging/nya staging/nya-get
          tar -C staging -czf "dist/nya-${VER}-linux-amd64.tar.gz" nya nya-get
      - uses: actions/upload-artifact@v4
        with:
          name: linux-amd64
          path: dist/*

  linux-arm64-cli:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - name: Build Go CLI (cross) + UPX
        run: |
          VER="${{ needs.version.outputs.version }}"
          sudo apt-get update
          sudo apt-get install -y upx-ucl
          mkdir -p staging dist
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o staging/nya ./cmd/nya
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o staging/nya-get ./cmd/nya-get
          upx --best --lzma staging/nya staging/nya-get
          tar -C staging -czf "dist/nya-${VER}-linux-arm64.tar.gz" nya nya-get
      - uses: actions/upload-artifact@v4
        with:
          name: linux-arm64-cli
          path: dist/*

  darwin:
    needs: version
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: arm64
            suffix: darwin-arm64
          - goarch: amd64
            suffix: darwin-amd64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - name: Build
        run: |
          VER="${{ needs.version.outputs.version }}"
          mkdir -p staging dist
          GOOS=darwin GOARCH=${{ matrix.goarch }} CGO_ENABLED=0 \
            go build -trimpath -ldflags="-s -w" -o staging/nya ./cmd/nya
          GOOS=darwin GOARCH=${{ matrix.goarch }} CGO_ENABLED=0 \
            go build -trimpath -ldflags="-s -w" -o staging/nya-get ./cmd/nya-get
          chmod +x staging/*
          tar -C staging -czf "dist/nya-${VER}-${{ matrix.suffix }}.tar.gz" nya nya-get
      - uses: actions/upload-artifact@v4
        with:
          name: darwin-${{ matrix.goarch }}
          path: dist/*

  publish:
    needs: [version, windows, linux-amd64, linux-arm64-cli, darwin]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: List assets
        run: find artifacts -type f | sort
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: NYA ${{ needs.version.outputs.tag }}
          draft: false
          generate_release_notes: true
          files: artifacts/*
          body: |
            ## Windows
            - **`nya-${{ needs.version.outputs.version }}-windows-amd64-setup.exe`** — installer (PATH + `.nya` → `nya open`, `.nyam` → `nya get`)
            - `nya-${{ needs.version.outputs.version }}-windows-amd64.zip` — portable zip (`nya.exe` + `nya-get.exe` shim)

            ## Other
            - Linux amd64 / arm64: `nya` + `nya-get` shim
            - macOS arm64 / amd64: `nya` + `nya-get` shim

            Docs: [docs/RELEASE.md](https://github.com/nyarime/nya/blob/main/docs/RELEASE.md)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
